<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Industrial Carbon Metallic -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>

    <!-- Toyota Red Vibrant Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B3D" />
      <stop offset="100%" stop-color="#EB0A1E" />
    </linearGradient>

    <!-- Secondary Red Darker for depth -->
    <linearGradient id="redDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EB0A1E" />
      <stop offset="100%" stop-color="#B80010" />
    </linearGradient>

    <!-- Chrome / Metallic Highlight -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Subtle Red Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#EB0A1E" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Badge: Dark Carbon Rounded Square -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="#EB0A1E" stroke-width="16" />
  <rect x="34" y="34" width="444" height="444" rx="90" fill="none" stroke="#2B2B2B" stroke-width="4" />

  <!-- Engine Group with subtle glow -->
  <g filter="url(#glow)">

    <!-- OIL FILLER CAP ON TOP -->
    <rect x="186" y="96" width="60" height="18" rx="6" fill="url(#chromeGrad)" />
    <rect x="206" y="114" width="20" height="26" fill="url(#chromeGrad)" />

    <!-- AIR INTAKE RUNNERS (Top Left) -->
    <path d="M 145 130 C 145 110, 175 110, 175 140" fill="none" stroke="url(#chromeGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- MAIN ENGINE BLOCK SILHOUETTE (Universal Car Engine / Check Engine Shape) -->
    <!-- Stepped, solid, highly recognizable silhouette -->
    <path d="
      M 140 140
      L 350 140
      A 12 12 0 0 1 362 152
      L 362 185
      L 410 185
      A 14 14 0 0 1 424 199
      L 424 235
      A 14 14 0 0 1 410 249
      L 385 249
      L 385 345
      A 16 16 0 0 1 369 361
      L 325 361
      L 325 385
      A 12 12 0 0 1 313 397
      L 187 397
      A 12 12 0 0 1 175 385
      L 175 361
      L 135 361
      A 16 16 0 0 1 119 345
      L 119 285
      L 85 285
      A 12 12 0 0 1 73 273
      L 73 227
      A 12 12 0 0 1 85 215
      L 119 215
      L 119 152
      A 12 12 0 0 1 131 140
      Z
    " fill="url(#redGrad)" />

    <!-- VALVE COVER ACCENT (Upper chamber) -->
    <rect x="160" y="160" width="180" height="24" rx="8" fill="#FFFFFF" opacity="0.95" />

    <!-- ENGINE CYLINDER DETAILS / INTAKE PORTS (3 horizontal chrome cooling fins) -->
    <rect x="180" y="215" width="140" height="16" rx="8" fill="#FFFFFF" />
    <rect x="180" y="248" width="140" height="16" rx="8" fill="#FFFFFF" />
    <rect x="180" y="281" width="140" height="16" rx="8" fill="#FFFFFF" />

    <!-- PULLEYS / FAN BELT (Front Drive Assembly on Left) -->
    <!-- Upper Pulley -->
    <circle cx="100" cy="185" r="16" fill="url(#chromeGrad)" stroke="#EB0A1E" stroke-width="4" />
    <circle cx="100" cy="185" r="5" fill="#141414" />

    <!-- Lower Pulley / Crankshaft -->
    <circle cx="100" cy="325" r="20" fill="url(#chromeGrad)" stroke="#EB0A1E" stroke-width="4" />
    <circle cx="100" cy="325" r="7" fill="#141414" />

    <!-- Serpentine Belt -->
    <path d="M 100 169 L 100 345" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="8 4" opacity="0.8" />

    <!-- STARTER MOTOR / TRANSMISSION BELLHOUSING ACCENT (Right Side) -->
    <rect x="390" y="275" width="36" height="50" rx="8" fill="url(#chromeGrad)" />
    <circle cx="408" cy="300" r="7" fill="#EB0A1E" />

    <!-- HIGH-VOLTAGE SPARK SYMBOL (Center Energy Core) -->
    <polygon points="255,215 235,260 252,260 240,305 272,255 253,255" fill="#FFEB3B" stroke="#EB0A1E" stroke-width="2" />

    <!-- OIL PAN ACCENTS (Bottom cárter ribs) -->
    <line x1="210" y1="375" x2="210" y2="390" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="250" y1="375" x2="250" y2="390" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="290" y1="375" x2="290" y2="390" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

  </g>
</svg>